name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  notes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            echo
            echo "Install steps are in the [readme](https://github.com/${GITHUB_REPOSITORY}#install). The Windows and macOS builds are unsigned."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  windows:
    needs: [test, notes]
    uses: ./.github/workflows/windows.yml

  windows-publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hearth-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: Hearth-windows.exe

  macos:
    needs: [test, notes]
    uses: ./.github/workflows/macos.yml

  macos-publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hearth-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Hearth-macos.zip

  flatpak:
    needs: [test, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hearth.flatpak
          manifest-path: packaging/flatpak/io.helv.Hearth.yml
          cache-key: flatpak-kde-6.10
      - uses: softprops/action-gh-release@v2
        with:
          files: hearth.flatpak
