name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  # First, before anything is built or published: every file that repeats the version must match the tag.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .agent-checks/bin/agent-checks release-version "$GITHUB_REF_NAME"

  # ci.yml has a job that opens issues, so the call has to allow it. A called workflow can never hold more than its caller,
  # and without this GitHub refuses to start the whole run (the `workflow-permissions` check in agent-checks checks this).
  test:
    needs: gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write

  notes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            echo
            echo "Install steps are in the [readme](https://github.com/${GITHUB_REPOSITORY}#install). The Windows and macOS builds are unsigned, so both warn the first time you open them. The readme says what to click and which Mac file is yours."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  windows:
    needs: [test, notes]
    uses: ./.github/workflows/windows.yml

  windows-publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hearth-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: Hearth-windows.exe

  macos:
    needs: [test, notes]
    uses: ./.github/workflows/macos.yml

  macos-publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      # Both disk images: Hearth-macos.dmg for Apple silicon, Hearth-macos-intel.dmg for Intel.
      - uses: actions/download-artifact@v4
        with:
          pattern: Hearth-macos*.dmg
          merge-multiple: true
      - run: ls -l Hearth-macos.dmg Hearth-macos-intel.dmg
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            Hearth-macos.dmg
            Hearth-macos-intel.dmg

  flatpak:
    needs: [test, notes]
    uses: ./.github/workflows/flatpak.yml

  flatpak-publish:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hearth.flatpak
      - uses: softprops/action-gh-release@v2
        with:
          files: hearth.flatpak

  # Last: the release page must hold all four files. A tag that ends with a page missing one is not a release.
  verify:
    needs: [windows-publish, macos-publish, flatpak-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .agent-checks/bin/agent-checks release-assets "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" Hearth-windows.exe Hearth-macos.dmg Hearth-macos-intel.dmg hearth.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
