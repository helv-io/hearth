name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  notes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$version"
            echo
            echo "Install steps are in the [readme](https://github.com/${GITHUB_REPOSITORY}#install). The Windows and macOS builds are unsigned."
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  windows:
    needs: [test, notes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pyinstaller
      - name: Build
        run: pyinstaller packaging/pyinstaller/hearth.spec
      - name: Pack
        run: |
          Compress-Archive -Path dist/hearth -DestinationPath Hearth-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Hearth-windows.zip

  macos:
    needs: [test, notes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pyinstaller
      - name: Build
        run: pyinstaller packaging/pyinstaller/hearth.spec
      - name: Pack
        run: ditto -c -k --keepParent dist/Hearth.app Hearth-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Hearth-macos.zip

  flatpak:
    needs: [test, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hearth.flatpak
          manifest-path: packaging/flatpak/io.helv.Hearth.yml
          cache-key: flatpak-kde-6.10
      - uses: softprops/action-gh-release@v2
        with:
          files: hearth.flatpak
