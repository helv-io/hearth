name: Windows build

# Builds the single hearth.exe, starts it once to prove it works, and keeps it
# as the Hearth-windows.exe artifact. The release workflow calls this one.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "cook/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pyinstaller
      - name: Build
        run: pyinstaller packaging/pyinstaller/hearth.spec
      - name: Start it and check the window
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/hearth.exe).Path
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "hearth.exe is $size MB"
          # A build this large has pulled in something it should not.
          if ($size -gt 400) { throw "hearth.exe is $size MB, over the 400 MB limit" }

          $version = Join-Path $env:RUNNER_TEMP version.txt
          $p = Start-Process $exe -ArgumentList '--version', $version -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--version did not finish" }
          Get-Content $version

          $seconds = @()
          foreach ($run in 1..3) {
            $report = Join-Path $env:RUNNER_TEMP "selftest$run.txt"
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process $exe -ArgumentList '--selftest', $report -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "start $run did not finish" }
            $clock.Stop()
            $seconds += [math]::Round($clock.Elapsed.TotalSeconds, 1)
            Get-Content $report
            if ($p.ExitCode -ne 0) { throw "start $run failed with exit code $($p.ExitCode)" }
          }
          Write-Host "Seconds to unpack, open and draw: $($seconds -join ', ')"
          $left = (Get-ChildItem $env:TEMP -Directory -Filter '_MEI*' -ErrorAction SilentlyContinue).Count
          Write-Host "Unpack folders left in the temp folder: $left"
          @(
            "### hearth.exe",
            "",
            "- Size: **$size MB**",
            "- Seconds to unpack, open and draw, three starts: $($seconds -join ', ')",
            "- Unpack folders left behind: $left",
            "",
            '```',
            (Get-Content (Join-Path $env:RUNNER_TEMP selftest3.txt)),
            '```'
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Name the file
        shell: pwsh
        run: Move-Item dist/hearth.exe Hearth-windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: Hearth-windows.exe
          path: Hearth-windows.exe
          if-no-files-found: error
          compression-level: 0
