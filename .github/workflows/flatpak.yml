name: Flatpak build

# Builds hearth.flatpak, installs it the way a person would, and starts it once to prove it works.
# A Flatpak that builds but does not start is the bug this file exists for (0.6.1 shipped one: the app
# failed on import with libgssapi_krb5.so.2 missing). Windows and macOS do the same with --selftest.
# The release workflow calls this one and then attaches the file.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "cook/**"
  pull_request:
    paths:
      - "packaging/flatpak/**"
      - "pyproject.toml"
      - ".github/workflows/flatpak.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hearth.flatpak
          manifest-path: packaging/flatpak/io.helv.Hearth.yml
          cache-key: flatpak-kde-6.10
          upload-artifact: false
      # Install the bundle and start it with no screen. This is what a person's computer does, so a library
      # the runtime lacks, or a Python package that is missing, fails here and not on their desktop.
      - name: Install it and start it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes --bundle hearth.flatpak
          flatpak run --command=python3 io.helv.Hearth -c 'import hearth.__main__'
          status=0
          flatpak run --env=QT_QPA_PLATFORM=offscreen --command=hearth io.helv.Hearth --selftest > selftest.txt || status=$?
          cat selftest.txt
          test "$status" -eq 0
          grep -qx ok selftest.txt
          size="$(du -h hearth.flatpak | cut -f1)"
          echo "- hearth.flatpak is $size, and it started with no screen" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hearth.flatpak
          path: hearth.flatpak
          if-no-files-found: error
          compression-level: 0
