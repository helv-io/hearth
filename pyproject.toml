[project]
name = "hearth"
version = "0.6.4"
description = "Desktop editor for an iPhone or iPad home screen."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "helv.io" }]
keywords = ["ios", "ipados", "home-screen", "springboard"]
dependencies = [
  "PySide6>=6.6",
  "pymobiledevice3>=11.31",
]

[project.urls]
Homepage = "https://github.com/helv-io/hearth"
Changelog = "https://github.com/helv-io/hearth/blob/master/CHANGELOG.md"
Issues = "https://github.com/helv-io/hearth/issues"

[project.scripts]
hearth = "hearth.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.setuptools.package-data]
hearth = ["qml/*"]

# One door for web requests: every request goes through hearth.net.open_url, which owns the certificate list.
# 5fda384 and b45ca90 each had to patch the same four modules because each opened its own connection.
[tool.ruff]
target-version = "py311"
exclude = [".agent-checks", "build", "dist"]

[tool.ruff.lint]
select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request.urlopen".msg = "Use hearth.net.open_url(); it owns the certificate list for every web request."

[tool.ruff.lint.per-file-ignores]
"hearth/net.py" = ["TID251"]
