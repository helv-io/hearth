[project]
name = "hearth"
version = "0.2.1"
description = "Desktop editor for an iPhone or iPad home screen."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "helv.io" }]
keywords = ["ios", "ipados", "home-screen", "springboard"]
dependencies = [
  "PySide6>=6.6",
  "pymobiledevice3>=4.0",
]

[project.urls]
Homepage = "https://github.com/helv-io/hearth"
Changelog = "https://github.com/helv-io/hearth/blob/main/CHANGELOG.md"
Issues = "https://github.com/helv-io/hearth/issues"

[project.scripts]
hearth = "hearth.__main__:main"
iphone-layout = "hearth.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearth*"]

[tool.setuptools.package-data]
hearth = ["qml/*"]
